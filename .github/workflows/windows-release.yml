name: Windows CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DBUILD_TESTING=ON
          "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test and validate data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          ctest --test-dir build -C Release --output-on-failure `
            --output-junit "$PWD\test-results\ctest-results.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Package Windows build
        shell: pwsh
        run: |
          $package = "dist\tvorin-windows-x64"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item "build\Release\tvorin.exe" $package
          Copy-Item assets "$package\assets" -Recurse
          New-Item -ItemType Directory -Force "$package\saves" | Out-Null
          Compress-Archive -Path "$package\*" `
            -DestinationPath "dist\tvorin-windows-x64.zip" -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: tvorin-windows-x64
          path: dist/tvorin-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        shell: pwsh
        run: |
          $expected = "v$((Get-Content VERSION -Raw).Trim())"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag ${{ github.ref_name }} does not match VERSION ($expected)."
          }

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: tvorin-windows-x64
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tvorin-windows-x64.zip
          generate_release_notes: true
