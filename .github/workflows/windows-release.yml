name: Windows CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DBUILD_TESTING=ON
          "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test and validate data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          ctest --test-dir build -C Release --output-on-failure `
            --output-junit "$PWD\test-results\ctest-results.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Package Windows build
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must contain MAJOR.MINOR.PATCH, got '$version'."
          }
          $package = "dist\tvorin-windows-x64"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item "build\Release\tvorin.exe" $package
          Copy-Item assets "$package\assets" -Recurse
          New-Item -ItemType Directory -Force "$package\saves" | Out-Null
          Compress-Archive -Path "$package\*" `
            -DestinationPath "dist\tvorin-$version-windows-x64.zip" -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: tvorin-windows-x64
          path: dist/tvorin-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish VERSION release
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must contain MAJOR.MINOR.PATCH, got '$version'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Verify release tag is not reused
        shell: pwsh
        run: |
          git fetch --force --tags
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch release tags."
          }
          $tag = "${{ steps.version.outputs.tag }}"
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) {
            $existingCommit = git rev-list -n 1 $tag
            if ($LASTEXITCODE -ne 0) {
              throw "Could not resolve existing tag $tag."
            }
            if ($existingCommit -ne "${{ github.sha }}") {
              throw "$tag already points to $existingCommit. Bump VERSION before publishing another commit."
            }
          } elseif ($LASTEXITCODE -ne 1) {
            throw "Could not check whether $tag already exists."
          }

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: tvorin-windows-x64
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Tvorin ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/tvorin-*-windows-x64.zip
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
